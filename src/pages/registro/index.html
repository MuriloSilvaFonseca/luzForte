<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuzForte | Registro</title>
    <link rel="stylesheet" href="../../styles/base/reset.css">
    <link rel="stylesheet" href="../../styles/pages/registro.css">
    <link rel="stylesheet" href="../../styles/components/messages.css">
    <script src="../../scripts/modules/jquery-4.0.0.min.js"></script>
    <script src="../../scripts/pages/registro.js"></script>
    
</head>
<body>

    <header class="registro-header">
        <img class="registro-logo" src="../../assets/images/logos/logo.png" alt="LuzForte Logo">
    </header>

    <main class="registro-page">
        <div class="cadastro-container">
         <a class="cadastro-voltar" href="../login/index.html" aria-label="Voltar"><img src="../../assets/images/icons/de-volta.png" alt="Voltar"></a>
            <h1>Criar nova conta</h1>
            <button class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20"
                        alt="Google" />
                    Continuar com o Google
                </button>
            <div class="divider"><span>OU</span></div>

            <form class="cadastro-form" action="" method="post">
                <label class="field">
                    <span class="field-label">Nome completo*</span>
                    <input type="text" name="nome" placeholder="Digite seu nome completo..." required>
                </label>

                <label class="field">
                    <span class="field-label">E-mail *</span>
                    <input type="email" name="email" placeholder="Digite seu e-mail..." required>
                    <span class="campo-error" id="email-error">Por favor, insira um e-mail válido.</span>
                </label>

                <label class="field">
                    <span class="field-label">Telefone*</span>
                    <input type="tel" name="telefone" placeholder="+55 (00) 00000-0000" required>
                </label>

                <label class="field">
                    <span class="field-label">CPF</span>
                    <input type="number" name="cpf" placeholder="000.000.000-00">
                </label>

                <label class="field password-field">
                    <span class="field-label">Senha*</span>
                    <div class="password-row">
                        <input type="password" name="senha" placeholder="Mínimo 8 caracteres" required>
                        <button id="mostrarSenha1" type="button" class="show-pass" aria-label="Mostrar senha"><img src="../../assets/images/icons/olho-fechado.png" alt="Mostrar senha"></button>
                    </div>
                    <small class="hint">Sua senha deve ter no mínimo 8 caracteres</small>
                </label>

                <label class="field password-field">
                    <span class="field-label">Confirmar Senha*</span>
                    <div class="password-row">
                        <input type="password" name="confirm_senha" placeholder="Digite sua senha novamente..." required>
                        <span class="campo-error" id="confirm-password-error">As senhas não coincidem</span>
                    <button id="mostrarSenha2" type="button" class="show-pass" aria-label="Mostrar senha"><img src="../../assets/images/icons/olho-fechado.png" alt="Mostrar senha"></button>
                    </div>
                </label>

                <button class="btn-cta" type="submit">Criar conta</button>

                <p class="terms">Ao clicar em Criar, você concorda com os Termos de Uso e a Política de Privacidade.</p>
            </form>
        </div>
    </main>


    
   
</body>
</html>
