<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuzForte | Login</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../../styles/pages/login.css">
    <link rel="stylesheet" href="../../styles/base/reset.css">
    <!-- Script -->
    <script src="../../scripts/modules/jquery-4.0.0.min.js"></script>
    <script src="../../scripts/pages/login.js"></script>
</head>

<body>

    <div class="pagina-login-container">

        <div class="login-esquerdo"><img src="../../assets/images/banners/imagem banner login.png" alt=""></div>

        <div class="login-direito">

            <img class="login-logo" src="../../assets/images/logos/logo.png" alt="LuzForte Logo">

            <div class="login-container">

                <form id="login-form">
                 <a class="cadastro-voltar" href="../home/index.html" aria-label="Voltar"><img src="../../assets/images/icons/de-volta.png" alt="Voltar"></a>
                <h2>Acesse sua conta</h2>
                <button id="google-btn" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20"
                        alt="Google" />
                    Continuar com o Google
                </button>
                <div class="login-divisor">
                    <span>Ou</span>
                </div>
                <div class="login-input">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </div>
                <div class="login-input">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    <a href="forgot-password.html">Esqueceu sua senha?</a>
                </div>
                <button class="login-button" type="button" onclick="login()">Entrar</button>
                <p class="goCadastro">Não possui uma conta? <a href="../registro/index.html">Crie uma</a></p>
                </form>
            </div>
        </div>
    </div>

    <div id="footer"></div>
    
</body>

</html>
