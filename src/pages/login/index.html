<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuzForte | Login</title>
    <link rel="stylesheet" href="../../styles/pages/login.css">
    <link rel="stylesheet" href="../../styles/base/reset.css">
</head>
<body>
    <script src="../../scripts/pages/login.js"></script>

    <div class="pagina-login-container">

        <div class="login-esquerdo"><img src="../../assets/images/banners/imagem banner login.png" alt=""></div>

        <div class="login-direito">
            
            <img class="login-logo" src="../../assets/images/logos/logo.png" alt="LuzForte Logo">

            <div class="login-container">
                <h2>Acesse sua conta</h2>
                <div class="login-divisor">
                <span>Ou</span>
                </div>
                    <div class="login-input">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                    </div>
                    <div class="login-input">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                        <a href="forgot-password.html">Esqueceu sua senha?</a>
                    </div>
                        <button type="submit">Entrar</button>
                        <p>Não possui uma conta? <a href="register.html">Crie uma</a></p>
            </div>
        </div>
    </div>
</body>
</html>
