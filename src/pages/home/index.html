<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuzForte | Home</title>
    <link rel="stylesheet" href="../../styles/pages/home.css">


</head>
<body>

<div class="top-bar">
    <div class="top-item">
        <img src="/src/assets/images/icons/icons8-localização-50.png" alt="Localização" class="icon">
        <span>Entrega para São João da Boa Vista</span>
    </div>

</div>

<!-- Cabeçalho -->
<header class="header">
    
    <!-- Logo -->
    <div class="logo">
        <img  class="logo-highlight" src="/src/assets/images/logos/image.png" alt=""> 
    </div>

    <!-- Busca -->
    <div class="search">
        <input type="text" placeholder="Buscar produtos..." class="search-input">
        <button class="search-button">
            <img src="/src/assets/images/icons/icons8-pesquisar-50.png" alt="Buscar" class="icon">
        </button>
    </div>

    <!-- Usuário -->
    <div class="user">
        <img src="/src/assets/images/icons/icons8-usuário-homem-com-círculo-48.png" alt="Usuário" class="icon">
        <span>Olá, Rogério</span>
    </div>

    <!-- Carrinho -->
    <div class="cart">
        <img src="/src/assets/images/icons/icons8-carrinho-de-compras-30.png" alt="Carrinho" class="icon">
        <span class="cart-badge"></span>
    </div>

</header>
<!-- Menu de navegação -->
<nav class="nav">

    <!-- Botão de categorias -->
    <button class="nav-categories">
        <span class="menu-icon">☰</span>
        <span>Categorias</span>
    </button>

    <!-- Links do menu -->
    <div class="nav-links">
        <a href="#" class="nav-link">Fios e Cabos</a>
        <a href="#" class="nav-link">Disjuntores</a>
        <a href="#" class="nav-link">Iluminação</a>
        <a href="#" class="nav-link">Tomadas</a>
        <a href="#" class="nav-link">Ferramentas</a>
        <a href="#" class="nav-link nav-link-highlight">Promoção</a>
    </div>

</nav>

    <script src="../../scripts/pages/home.js"></script>
</body>
</html>
